<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>ذكاء SD GENESIS</title>
<meta name="description" content="ذكاء SD GENESIS — مساعد ذكي يفهم أسئلتك ويحللها ويجيب عنها، داخل الفضاء الكوني لشركة SD GENESIS.">
<meta name="theme-color" content="#02030a">
<meta name="sd-build" content="2026-11-25-L">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#D4AF37;--gold2:#F5D060;--gold3:#F5E08C;--silver:#d9dee6;--green:#4ade80;--bg:#02030a;--text:#eef1f6;--muted:rgba(232,236,244,.62);
  --col:min(780px,calc(100vw - 32px));--composer-h:96px;--vvh:100dvh;--kb:0px;
  --halo:0 1px 2px rgba(0,0,0,.95),0 0 14px rgba(2,3,10,.92),0 0 28px rgba(2,3,10,.7)}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Cairo',sans-serif;color:var(--text);-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
::selection{background:rgba(212,175,55,.35);color:#fff}

/* ---------- the cosmos: full screen, always visible ---------- */
#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}

/* ---------- floating top controls (no bar) ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:'Inter',sans-serif;font-weight:900;font-size:.98rem;letter-spacing:.06em;text-shadow:var(--halo);direction:ltr}
.brand .gt{text-shadow:none;background:linear-gradient(135deg,#F5E08C,#D4AF37 45%,#4ade80);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(212,175,55,.35))}
.brand small{font-weight:700;font-size:.66rem;letter-spacing:.24em;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.orb{width:22px;height:22px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 35%,#fff7d6,#F5D060 35%,#16a34a 85%);box-shadow:0 0 14px rgba(245,208,96,.7),0 0 26px rgba(74,222,128,.35);position:relative}
.orb::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(245,224,140,.55);border-left-color:transparent;border-bottom-color:transparent;animation:spin 3.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tools{display:flex;align-items:center;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--silver);transition:color .2s,background .2s,transform .2s;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.ib:hover{color:var(--gold3);background:rgba(212,175,55,.12)}
.ib:active{transform:scale(.92)}
.mode{font-size:.7rem;font-weight:700;color:var(--muted);text-shadow:var(--halo);display:flex;align-items:center;gap:6px;padding:0 6px;white-space:nowrap}
.mode i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.mode.off i{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
@media(max-width:520px){.brand small,.mode span.long{display:none}}

/* ---------- conversation, written straight onto the cosmos ---------- */
#thread{position:fixed;left:0;right:0;top:0;height:var(--vvh);z-index:5;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:smooth;
  padding:calc(70px + env(safe-area-inset-top)) 0 calc(var(--composer-h) + 34px);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 64px,#000 calc(100% - var(--composer-h) - 20px),transparent calc(100% - var(--composer-h) + 10px));mask-image:linear-gradient(180deg,transparent 0,#000 64px,#000 calc(100% - var(--composer-h) - 20px),transparent calc(100% - var(--composer-h) + 10px))}
#thread::-webkit-scrollbar{width:6px}#thread::-webkit-scrollbar-thumb{background:rgba(212,175,55,.25);border-radius:6px}
.col{width:var(--col);margin:0 auto;display:flex;flex-direction:column;gap:26px}
.m{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;text-shadow:var(--halo);line-height:1.95;font-size:1.02rem}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.who{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.04em;margin-bottom:4px;color:var(--muted)}
/* user: gold text, a fine gold thread on the side -- no bubble */
.m.user{align-self:flex-start;max-width:88%;padding-inline-start:14px;border-inline-start:2px solid rgba(245,208,96,.85);box-shadow:-1px 0 0 0 transparent}
.m.user .who{color:var(--gold3)}
.m.user .txt{color:#fbecb4;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext}
/* assistant: clear light text with a small living orb */
.m.ai .who{color:#bdf5d0}
.m.ai .who .orb{width:16px;height:16px}
.m.ai .who .orb::after{inset:-4px}
.tag{font-size:.64rem;font-weight:700;color:var(--gold3);opacity:.85;border-inline-start:1px solid rgba(245,224,140,.35);padding-inline-start:8px}
/* markdown */
.md{color:var(--text);overflow-wrap:anywhere}
.md>*+*{margin-top:.7em}
.md p,.md li,.md h1,.md h2,.md h3,.md h4,.md blockquote,.md td,.md th{unicode-bidi:plaintext}
.md h1,.md h2,.md h3,.md h4{font-weight:800;line-height:1.5;color:#fff;margin-top:1.1em}
.md h1{font-size:1.35rem}.md h2{font-size:1.2rem;color:var(--gold3)}.md h3{font-size:1.07rem;color:#d8f7e3}.md h4{font-size:1rem}
.md strong{color:#fff;font-weight:800}.md em{color:#e6e9f0}
.md ul,.md ol{padding-inline-start:1.4em}.md li+li{margin-top:.25em}.md li::marker{color:var(--gold2)}
.md blockquote{border-inline-start:2px solid rgba(74,222,128,.6);padding-inline-start:12px;color:#d6dbe4}
.md hr{border:0;height:1px;background:linear-gradient(90deg,transparent,rgba(245,224,140,.5),transparent)}
.md a{color:#86efac;text-decoration:underline;text-underline-offset:3px}
.md code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;color:#fde68a;padding:0 .3em;direction:ltr;unicode-bidi:embed}
.md pre{position:relative;direction:ltr;text-align:left;margin-top:.9em;padding:34px 14px 14px;border-radius:12px;background:rgba(4,6,12,.72);overflow-x:auto;text-shadow:none;border-inline-start:2px solid rgba(212,175,55,.5)}
.md pre code{color:#e5e7eb;padding:0;font-size:.85rem;line-height:1.65;white-space:pre}
.md pre .lang{position:absolute;top:8px;left:12px;font:600 .66rem 'Inter',sans-serif;letter-spacing:.12em;color:var(--gold3);text-transform:uppercase}
.md pre .cp{position:absolute;top:5px;right:8px;font:600 .7rem 'Cairo',sans-serif;color:var(--silver);padding:3px 8px;border-radius:8px}
.md pre .cp:hover{color:var(--gold3);background:rgba(212,175,55,.12)}
.md .tw{overflow-x:auto;margin-top:.9em}
.md table{border-collapse:collapse;min-width:60%;font-size:.93rem;text-shadow:none}
.md th,.md td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.12);text-align:start;vertical-align:top}
.md th{color:var(--gold3);font-weight:800;border-bottom:1px solid rgba(245,224,140,.5)}
.md tr:nth-child(even) td{background:rgba(2,3,10,.35)}
.md .math{font-family:'JetBrains Mono',monospace;color:#fde68a;direction:ltr;unicode-bidi:isolate}
.md .math.block{display:block;text-align:center;margin:.8em 0;overflow-x:auto}
.md .katex{font-size:1.06em;color:#fff7d6}
.caret{display:inline-block;width:8px;height:1.05em;vertical-align:-2px;margin-inline-start:2px;background:linear-gradient(180deg,var(--gold3),var(--green));border-radius:2px;animation:blink 1s steps(2) infinite;box-shadow:0 0 10px rgba(245,224,140,.8)}
@keyframes blink{50%{opacity:0}}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.think .dots{position:relative;width:22px;height:22px}
.think .dots i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold2);animation:spin 1s linear infinite}
.think .dots i:nth-child(2){inset:4px;border-top-color:var(--green);animation-duration:.7s;animation-direction:reverse}
.think .dots i:nth-child(3){inset:8px;border-top-color:var(--silver);animation-duration:1.3s}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:8px;opacity:.85}
.act{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--muted);padding:5px 9px;border-radius:999px;transition:color .2s,background .2s}
.act:hover{color:var(--gold3);background:rgba(212,175,55,.1)}
.srcs{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:.8rem}
.srcs b{font-size:.7rem;letter-spacing:.04em;color:var(--gold3)}
.srcs a{color:#86efac;text-decoration:none;display:flex;gap:6px;align-items:baseline;overflow-wrap:anywhere}
.srcs a span{color:var(--muted);font-size:.72rem;direction:ltr}
.err{color:#fca5a5;font-weight:600}
.err .act{color:#fde68a}
.stopped{font-size:.72rem;color:var(--muted);margin-top:4px}

/* empty state */
.hello{min-height:calc(var(--vvh) - var(--composer-h) - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;text-shadow:var(--halo)}
.hello h1{text-shadow:none;font-weight:900;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.3;background:linear-gradient(120deg,#fff 0%,#F5E08C 40%,#D4AF37 60%,#4ade80 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.9))}
.hello p{color:var(--muted);max-width:520px;font-size:.95rem}
.ideas{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;max-width:640px;margin-top:6px}
.idea{font-size:.86rem;font-weight:600;color:#e5e7eb;padding:6px 4px;border-bottom:1px dashed rgba(245,224,140,.45);transition:color .2s,border-color .2s;text-shadow:var(--halo)}
.idea:hover{color:var(--gold3);border-color:var(--gold3)}

/* ---------- the writing place: directly on the cosmos (no box, no card, no frame) ---------- */
.composer{position:fixed;left:0;right:0;bottom:var(--kb);z-index:15;padding:0 0 calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.composer .row{width:var(--col);margin:0 auto;display:flex;align-items:flex-end;gap:10px;pointer-events:auto}
.composer textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:#fff;font:600 1.06rem/1.7 'Cairo',sans-serif;padding:10px 4px 8px;max-height:38vh;min-height:46px;
  caret-color:var(--gold2);text-shadow:var(--halo);unicode-bidi:plaintext;overflow-y:auto}
.composer textarea::placeholder{color:rgba(232,236,244,.5);text-shadow:var(--halo)}
.composer .line{width:var(--col);margin:0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(245,224,140,.55) 20%,rgba(74,222,128,.55) 80%,transparent);opacity:.55;transition:opacity .3s,filter .3s;pointer-events:none}
.composer.focus .line{opacity:1;filter:drop-shadow(0 0 6px rgba(245,224,140,.8))}
.send{flex:0 0 40px;width:40px;height:40px;margin-bottom:6px;border-radius:50%;display:grid;place-items:center;color:#1a1300;background:radial-gradient(circle at 35% 30%,#fff3c4,#F5D060 45%,#D4AF37);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 18px rgba(245,208,96,.55),0 0 34px rgba(74,222,128,.2);transition:transform .2s,opacity .2s}
.send:hover{transform:scale(1.07)}.send:active{transform:scale(.94)}
.send:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.send.stop{background:radial-gradient(circle at 35% 30%,#fff,#d9dee6 55%,#9aa1ab)}
.send svg{display:block}
.meta{width:var(--col);margin:4px auto 0;display:flex;justify-content:space-between;font-size:.66rem;color:rgba(232,236,244,.45);text-shadow:var(--halo);pointer-events:none}
@media(hover:none){.meta .hint{visibility:hidden}}
.down{position:fixed;z-index:16;left:50%;bottom:calc(var(--composer-h) + var(--kb) + 8px);transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--gold3);transition:opacity .25s,transform .25s;filter:drop-shadow(0 0 6px rgba(0,0,0,.9))}
.down.on{opacity:1;transform:translateX(-50%);pointer-events:auto}

/* ---------- conversations drawer (small, out of the way) ---------- */
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:40;width:min(320px,86vw);padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,rgba(3,5,12,.86),rgba(3,5,12,.78));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid rgba(212,175,55,.18);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer h2{font-size:.95rem;font-weight:800;color:var(--gold3);display:flex;align-items:center;justify-content:space-between}
.newbtn{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem;color:#1a1300;background:linear-gradient(135deg,#F5E08C,#D4AF37);padding:9px 14px;border-radius:12px}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:4px}
.it{display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:10px;color:#e5e7eb;font-size:.86rem}
.it:hover,.it.cur{background:rgba(212,175,55,.1)}
.it.cur{color:var(--gold3)}
.it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.it .d{font-size:.64rem;color:var(--muted);white-space:nowrap}
.it input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.5);border-radius:8px;color:#fff;font:inherit;padding:4px 8px;outline:0}
.it .x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.it .x:hover{color:var(--gold3);background:rgba(255,255,255,.06)}
.it .x.del.arm{color:#fca5a5;background:rgba(239,68,68,.14);width:auto;padding:0 8px;font-size:.7rem;font-weight:800}
.empty{color:var(--muted);font-size:.82rem;padding:10px 4px}
.note{font-size:.66rem;color:var(--muted);line-height:1.6}

/* ---------- opening sequence ---------- */
#intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;opacity:0;visibility:hidden}
body.intro #intro{opacity:1;visibility:visible;pointer-events:auto}
#intro .black{position:absolute;inset:0;background:#02030a}
body.intro #intro .black{animation:blackout var(--d,2s) cubic-bezier(.6,0,.4,1) both}
@keyframes blackout{0%{opacity:1}22%{opacity:.82}70%{opacity:.3}100%{opacity:0}}
#intro .flash{position:absolute;left:50%;top:42%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6d6 30%,rgba(245,224,140,.6) 55%,rgba(74,222,128,0) 72%);box-shadow:0 0 40px 12px rgba(245,224,140,.55),0 0 90px 30px rgba(74,222,128,.25);opacity:0}
body.intro #intro .flash{animation:energy var(--d,2s) cubic-bezier(.2,.8,.2,1) both}
@keyframes energy{0%{opacity:0;transform:scale(.2)}10%{opacity:1;transform:scale(1)}26%{opacity:1;transform:scale(2.6)}46%{opacity:.85;transform:scale(1.4)}78%{opacity:.4;transform:scale(1)}100%{opacity:0;transform:scale(9)}}
#intro .beam{position:absolute;left:0;right:0;top:42%;height:2px;transform:translateY(-50%) scaleX(0);background:linear-gradient(90deg,transparent,#fff,#F5E08C,#4ade80,#fff,transparent);box-shadow:0 0 26px 5px rgba(245,224,140,.65);opacity:0}
body.intro #intro .beam{animation:beam var(--d,2s) cubic-bezier(.2,.8,.2,1) both}
@keyframes beam{0%,6%{opacity:0;transform:translateY(-50%) scaleX(0)}18%{opacity:1;transform:translateY(-50%) scaleX(1)}36%{opacity:0;transform:translateY(-50%) scaleX(1.2)}100%{opacity:0}}
#intro .title{position:relative;text-align:center;opacity:0}
body.intro #intro .title{animation:title var(--d,2s) cubic-bezier(.2,.8,.2,1) both}
@keyframes title{0%,34%{opacity:0;transform:translateY(10px) scale(.94);filter:blur(10px);letter-spacing:.6em}56%{opacity:1;transform:none;filter:none;letter-spacing:.22em}82%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(1.12);filter:blur(6px)}}
#intro .t1{display:block;direction:ltr;font-family:'Inter',sans-serif;font-weight:900;font-size:clamp(1.8rem,6.5vw,3.6rem);letter-spacing:.22em;background:linear-gradient(120deg,#fff 0%,#F5E08C 35%,#D4AF37 55%,#4ade80 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#intro .t2{display:block;margin-top:8px;font-weight:800;font-size:clamp(.95rem,2.8vw,1.3rem);color:rgba(255,255,255,.85)}
#intro .skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:.78rem;color:rgba(255,255,255,.55);padding:6px 16px;border-radius:999px}
.rv{transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
body.intro .rv{opacity:0;transform:translateY(16px)}
@media(prefers-reduced-motion:reduce){.m,.orb::after,.think .dots i,.caret{animation:none}.rv{transition:none}#thread{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="cosmos" aria-hidden="true"></canvas>

<div id="intro" aria-hidden="true">
    <div class="black"></div><div class="beam"></div><div class="flash"></div>
    <div class="title"><span class="t1">SD GENESIS</span><span class="t2">ذكاء SD GENESIS</span></div>
    <button type="button" class="skip" id="introSkip">تخطّي</button>
</div>

<header class="top rv">
    <a href="/" class="brand" title="العودة إلى الصفحة الرئيسية"><span class="orb" aria-hidden="true"></span><span class="gt">SD GENESIS</span><small>AI</small></a>
    <div class="tools">
        <span class="mode" id="mode" title="حالة المساعد"><i></i><span id="modeText">…</span></span>
        <button class="ib" id="newBtn" title="محادثة جديدة" aria-label="محادثة جديدة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="ib" id="histBtn" title="المحادثات" aria-label="المحادثات السابقة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    </div>
</header>

<main id="thread" aria-live="polite"><div class="col" id="col"></div></main>
<button class="down" id="down" aria-label="انتقل إلى آخر رسالة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>

<form class="composer rv" id="composer" autocomplete="off">
    <div class="row">
        <textarea id="input" rows="1" maxlength="4000" placeholder="اكتب رسالتك إلى ذكاء SD GENESIS…" aria-label="اكتب رسالتك"></textarea>
        <button type="submit" class="send" id="send" aria-label="إرسال" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 4 12h5v8h6v-8h5z"/></svg></button>
    </div>
    <div class="line"></div>
    <div class="meta"><span class="hint">Enter للإرسال · Shift + Enter لسطر جديد</span><span id="count"></span></div>
</form>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="المحادثات">
    <h2>المحادثات <button class="ib" id="closeDrawer" aria-label="إغلاق"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h2>
    <button class="newbtn" id="newBtn2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>محادثة جديدة</button>
    <div class="list" id="list"></div>

<script>
// ===== Opening sequence (≈1.2–2 s, skippable, not repeated on a quick re-entry) =====
(function () {
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var weak = (navigator.hardwareConcurrency || 4) <= 2 || (navigator.deviceMemory || 4) <= 2;
    var KEY = 'sd_ai_intro_at', q = location.search, force = /[?&]intro=1/.test(q), never = /[?&]intro=0/.test(q);
    var lastAt = 0; try { lastAt = Number(sessionStorage.getItem(KEY) || 0); } catch (e) {}
    var play = !never && !reduce && (force || Date.now() - lastAt > 5 * 60 * 1000);
    var D = weak ? 1.25 : 2.0, done = false, timer = null;
    function finish() { if (done) return; done = true; clearTimeout(timer); document.body.classList.remove('intro'); document.body.classList.add('ready'); dispatchEvent(new Event('ai:ready')); }
    window.__intro = { played: play, duration: D, finish: finish, done: function () { return done; } };
    if (!play) { document.body.classList.add('ready'); done = true; return; }
    try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
    document.documentElement.style.setProperty('--d', D + 's');
    document.body.classList.add('intro');
    if (window.__core) window.__core.intro(D);
    timer = setTimeout(finish, D * 1000 - 120);
    document.getElementById('introSkip').addEventListener('click', finish);
    document.getElementById('intro').addEventListener('click', function (e) { if (e.target.id !== 'introSkip') finish(); });
    addEventListener('keydown', function (e) { if (!done && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) finish(); });

            var rn = el('button', 'x', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'); rn.title = 'تسمية'; rn.type = 'button';
            rn.addEventListener('click', function () {
                var inp = document.createElement('input'); inp.value = c.title || ''; inp.maxLength = 80; it.replaceChild(inp, tt); inp.focus(); inp.select();
                var ok = function () { c.title = inp.value.trim() || c.title; save(); renderList(); };
                inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); if (e.key === 'Escape') renderList(); }); inp.addEventListener('blur', ok);
            });
            var del = el('button', 'x del', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'); del.title = 'حذف'; del.type = 'button';
            del.addEventListener('click', function () {
                if (!del.classList.contains('arm')) { del.classList.add('arm'); del.textContent = 'تأكيد الحذف'; setTimeout(function () { if (del.isConnected) renderList(); }, 3500); return; }
                convos = convos.filter(function (x) { return x.id !== c.id; }); save();
                if (cur && cur.id === c.id) newConvo(); else renderList();
            });
            it.appendChild(tt); it.appendChild(dd); it.appendChild(rn); it.appendChild(del); list.appendChild(it);
        });
    }

    // ---------- start ----------
    function setMode() {
        modeEl.classList.toggle('off', !cfg.enabled || !cfg.ai);
        modeText.innerHTML = !cfg.enabled ? 'متوقف مؤقتًا' : cfg.ai ? 'ذكاء اصطناعي' + (cfg.web_search ? '<span class="long"> · بحث الإنترنت</span>' : '') : 'معلومات معتمدة فقط';
        if (!cfg.enabled) { input.disabled = true; input.placeholder = 'المساعد متوقف مؤقتًا'; }
    }
    load();
    var curId = null; try { curId = sessionStorage.getItem(CUR); } catch (e) {}
    cur = convos.filter(function (c) { return c.id === curId; })[0] || { id: uid(), title: '', created: Date.now(), updated: Date.now(), messages: [] };
    fetch('/api/ai/config', { headers: { Accept: 'application/json' } }).then(function (r) { return r.ok ? r.json() : null; }).then(function (c) { if (c) cfg = c; }).catch(function () {})
        .then(function () { setMode(); renderAll(); autosize(); });
    function boot() { measure(); if (!matchMedia('(hover:none)').matches) input.focus({ preventScroll: true }); }
    if (window.__intro && !window.__intro.done()) addEventListener('ai:ready', boot, { once: true }); else boot();
    window.__ai = { send: send, stop: stopGen, regenerate: regenerate, state: function () { return { busy: busy, messages: cur.messages.length, convos: convos.length, cfg: cfg, current: cur.id }; } };
})();
